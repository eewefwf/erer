name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle OCR runtime (onnxruntime-web)
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/ocr"
          mkdir -p "$DEST"
          cd /tmp
          npm pack onnxruntime-web@1.18.0
          tar -xzf onnxruntime-web-1.18.0.tgz
          find /tmp/package/dist -maxdepth 1 -type f -exec cp -f {} "$DEST/" \;
          ls -lh "$DEST" | head -20

      - name: Bundle OCR models (PP-OCRv5 mobile)
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/ocr"
          mkdir -p "$DEST"
          BASE="https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0"

          curl -fL --retry 3 --retry-delay 2 -o "$DEST/det.onnx" \
            "$BASE/onnx/PP-OCRv5/det/ch_PP-OCRv5_det_mobile.onnx"
          curl -fL --retry 3 --retry-delay 2 -o "$DEST/rec.onnx" \
            "$BASE/onnx/PP-OCRv5/rec/ch_PP-OCRv5_rec_mobile.onnx"
          curl -fL --retry 3 --retry-delay 2 -o "$DEST/dict.txt" \
            "$BASE/paddle/PP-OCRv5/rec/ch_PP-OCRv5_rec_mobile/ppocrv5_dict.txt"

          echo "---- 校验 ----"
          echo "det sha: $(sha256sum "$DEST/det.onnx" | cut -d' ' -f1)"
          echo "rec sha: $(sha256sum "$DEST/rec.onnx" | cut -d' ' -f1)"
          echo "字典行数: $(wc -l < "$DEST/dict.txt")"
          ls -lh "$DEST/det.onnx" "$DEST/rec.onnx" "$DEST/dict.txt" "$DEST/ort.min.js"

          test -s "$DEST/det.onnx"
          test -s "$DEST/rec.onnx"
          test -s "$DEST/dict.txt"
          test -s "$DEST/ort.min.js"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: formula-calc-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
